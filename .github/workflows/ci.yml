#
# Build ScarletNX for Windows in MSYS2 CLANG64 (docs/build/SCARLETNX_BUILD-NOTES.md) and run its ctest suite.
# No game file, key or save is used: the tests need none, and a hosted runner has no GPU, so the game is never run.
# The job name "Windows build and test" is the check name to require on main. Keep it stable.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main and manual runs are never cancelled.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-2025
    # A run without caches took 16 minutes (2026-11-11). The limit leaves room for a slow runner.
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
        working-directory: third_party/ScarletNX
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the MSYS2 CLANG64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          path-type: strict
          install: >-
            git
            make
            patch
            perl
            patchutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-glslang

      - name: Show the toolchain
        id: toolchain
        run: |
          set -euo pipefail
          clang --version
          llvm-config --version
          cmake --version
          echo "clang=$(clang --version | head -n1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
          # FFmpeg and OpenSSL are built once per toolchain and reused (cmake/deps_cache.cmake). CMake wants / here.
          echo "SNX_DEPS_CACHE=$(cygpath -m "$PWD/.cache/deps")" >> "$GITHUB_ENV"
          appdata="$(cygpath -u "$RUNNER_TEMP")/snx-appdata"
          mkdir -p "$appdata"
          echo "SNX_CI_APPDATA=$(cygpath -w "$appdata")" >> "$GITHUB_ENV"

      # Source archives that CPM downloads, each checked by SHA-256. A miss only means a download.
      - name: Cache the CPM sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ScarletNX/.cache/cpm
          key: cpm-windows-${{ hashFiles('third_party/ScarletNX/cmake/dependencies.cmake') }}

      # The FFmpeg and OpenSSL builds. The cache folder checks its own inputs, so a stale entry is rebuilt, not used.
      - name: Restore the FFmpeg and OpenSSL builds
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ScarletNX/.cache/deps
          key: deps-windows-${{ steps.toolchain.outputs.clang }}-${{ hashFiles('third_party/ScarletNX/cmake/dependencies.cmake', 'third_party/ScarletNX/cmake/ffmpeg*', 'third_party/ScarletNX/cmake/openssl.cmake', 'third_party/ScarletNX/cmake/deps_*.cmake') }}

      # -mcx16: the 16-byte atomics of two test targets fail -Werror without it (SCARLETNX_BUILD-NOTES.md).
      # SNX_DEPLOY=OFF: CI has no recompiled game to copy the runtime to.
      - name: Configure
        run: |
          set -euo pipefail
          cmake --preset default \
            -DCMAKE_C_FLAGS=-mcx16 \
            -DSNX_LLVM_CONFIG="$(cygpath -m "$(command -v llvm-config)")" \
            -DSNX_FFMPEG_SH="$(cygpath -m /usr/bin/sh.exe)" \
            -DSNX_FFMPEG_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DPERL_EXECUTABLE="$(cygpath -m /usr/bin/perl.exe)" \
            -DSNX_OPENSSL_MAKE="$(cygpath -m /usr/bin/make.exe)" \
            -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON \
            -DSNX_DEPLOY=OFF

      - name: Build
        id: build
        run: cmake --build --preset default --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Save the FFmpeg and OpenSSL builds
        if: steps.deps.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ScarletNX/.cache/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Check the executable starts
        run: build/default/scarletnx.exe --help > /dev/null

      # tracked_material is excluded: it fails on two SMAA .dds files under src/nx/gpu/vk/shaders/smaa/ (a known
      # failure, the fix waits for a decision). Remove the -E option when it is fixed. APPDATA gives the tests that
      # write settings a clean folder of their own.
      - name: Run ctest
        run: |
          set -euo pipefail
          export APPDATA="$SNX_CI_APPDATA"
          ctest --test-dir build/default --output-on-failure --no-tests=error --timeout 900 --parallel 4 \
            --exclude-regex '^tracked_material$'

      - name: Upload the ctest log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: third_party/ScarletNX/build/default/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore
          retention-days: 7
