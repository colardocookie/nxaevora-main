#
# Run the Python tests of tools/ and the checks on the tracked files. No game file, key or save is used: the checks
# read the tracked files only. A checkout from a fork runs them too, so a pull request from a fork gets the result.
name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main and manual runs are never cancelled.
concurrency:
  group: >-
    repo-checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Compile only. Some scripts need engine/tools or the extracted game folder, so an import would fail.
      - name: Compile the tools scripts
        run: python -m py_compile tools/*.py

      # A run with no test exits with code 5 on Python 3.12, so this step fails when the tests are gone.
      - name: Run the tools tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Check the license headers
        run: python tools/check_spdx.py

      - name: Guard against game data
        run: python tools/check_game_data.py
