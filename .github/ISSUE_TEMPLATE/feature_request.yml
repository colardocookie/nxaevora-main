name: Feature request
description: Suggest a new feature or a change to how NXAevora works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [ROADMAP.md](https://github.com/nxaevora/nxaevora-main/blob/main/ROADMAP.md) first. Game enhancements such as higher frame rates come after the native port works. Such requests stay open until then.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Graphics
        - Input and camera
        - Mods and files
        - Launcher
        - Game enhancement (frame rate, resolution and similar)
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do now, or what is hard to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want NXAevora to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
      description: Other ways to solve the problem that you thought about.
