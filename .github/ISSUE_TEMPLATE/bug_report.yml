name: Bug or crash
description: The game crashes, stops, or does something wrong that is not a graphics problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not attach or link keys, dumps (NSP, XCI, NCA), extracted game files, saves or shader and texture dumps. Paste only the log lines that the form asks for, as text.
  - type: checkboxes
    id: game-data
    attributes:
      label: Game data
      options:
        - label: This report has no keys, dumps, extracted game files, saves or links to them.
          required: true
  - type: dropdown
    id: game-version
    attributes:
      label: Game version
      options:
        - Update 1.1.1
        - Base game (1.0.0)
        - Other (write it below)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: NXAevora commit
      description: The commit that you built, for example the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System
      description: OS, CPU, GPU and the GPU driver version.
      placeholder: |
        OS: Windows 11 24H2
        CPU: AMD Ryzen 7 7800X3D
        GPU: NVIDIA GeForce RTX 4070, driver 566.36
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: The lines of the `.ini` file that you changed, for example `nvn_native`.
      render: ini
  - type: textarea
    id: steps
    attributes:
      label: Scene and steps
      description: Where in the game the problem occurs and what you did before it.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: rate
    attributes:
      label: How often
      description: How many runs had the problem, out of how many runs. For example "3 of 5".
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The crash block and the lines with `not implemented` from `<id>.log`, as text. Do not attach the whole log.
      render: text
